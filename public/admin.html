<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Ermawan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f7d4f'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='800' text-anchor='middle' font-family='Arial,sans-serif' fill='white'%3EE%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f8f5;--s:#fff;--t:#14201a;--m:#5b6b62;--l:#dfe5e0;--a:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#0b110e;--s:#121b16;--t:#e8efe9;--m:#93a39a;--l:#1f2c25;--a:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--l);position:sticky;top:0;background:var(--bg);z-index:5}
main{max-width:820px;margin:0 auto;padding:20px}h2{margin:28px 0 12px}
.box{max-width:340px;margin:18vh auto;padding:24px;background:var(--s);border:1px solid var(--l);border-radius:14px}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12px;color:var(--m);margin:0 0 10px}label input,label textarea,label select{margin-top:4px}
input[type=checkbox]{width:auto;margin-right:6px}
button{padding:8px 16px;border:0;border-radius:8px;background:var(--a);color:#06130b;font-weight:600;cursor:pointer}button.g{background:none;border:1px solid var(--l);color:var(--t)}
.it{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:12px}.cv{display:flex;gap:12px;align-items:flex-end;margin-bottom:10px}.cv img{height:70px;border-radius:6px}.cv label{flex:1;margin:0}
a{color:var(--a)}#err{color:#e5484d;min-height:1.2em;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--a);color:#06130b;padding:9px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.3s;pointer-events:none}#toast.show{opacity:1}#toast.bad{background:#e5484d;color:#fff}
</style></head><body>
<div id="login" class="box"><h1 style="margin:0 0 14px;font-size:22px">Admin</h1><label>Password<input id="pw" type="password" autocomplete="current-password"></label><button id="go">Sign in</button><p id="err"></p></div>
<div id="app" hidden>
<header><b>Portfolio admin</b><span style="display:flex;gap:10px;align-items:center"><a href="/" target="_blank">View site</a><button id="save">Save changes</button><button id="out" class="g">Sign out</button></span></header>
<main>
<h2>Hero</h2><div class="it"><label>Intro text<textarea id="lead" maxlength="400"></textarea></label><label><input type="checkbox" id="otw">Show availability badge</label><label>Badge text<input id="otx" maxlength="80"></label></div>
<h2>About</h2><div class="it"><label>About paragraph<textarea id="abt" style="min-height:120px" maxlength="1200"></textarea></label></div>
<h2>Stats row</h2><div id="st"></div><button id="addst" class="g">+ Add stat</button>
<h2>Experience</h2><div id="ex"></div><button id="addx" class="g">+ Add job</button>
<h2>Skills</h2><div id="sk"></div><button id="addsk" class="g">+ Add skill group</button>
<h2>Projects</h2><div id="pj"></div><button id="addp" class="g">+ Add project</button>
<h2>Books</h2><div id="bk"></div><button id="addb" class="g">+ Add book</button>
<h2>Certificates</h2><div id="ce"></div><button id="addc" class="g">+ Add certificate</button>
<h2>Education</h2><div id="ed"></div><button id="adde" class="g">+ Add education</button>
<h2>Contact</h2><div class="it"><label>Email<input data-ct="email"></label><label>Phone<input data-ct="phone"></label><label>LinkedIn URL (https://…)<input data-ct="linkedin"></label><label>Website URL (https://…)<input data-ct="website"></label></div>
</main></div><div id="toast"></div>
<script>
const $=i=>document.getElementById(i);let C;
const api=(u,o={})=>fetch(u,{credentials:"same-origin",...o}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j});
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function toast(t,bad){const e=$("toast");e.textContent=t;e.className=bad?"bad show":"show";setTimeout(()=>e.className="",2200)}
async function load(){C=await api("/api/content");C.settings=C.settings||{};C.projects=C.projects||[];C.books=C.books||[];["experience","skills","certs","education","stats"].forEach(k=>C[k]=C[k]||[]);C.contact=C.contact||{};draw();$("login").hidden=true;$("app").hidden=false}
function draw(){const s=C.settings;$("lead").value=s.lead||"";$("otw").checked=!!s.openToWork;$("otx").value=s.openText||"";$("abt").value=s.about||"";["email","phone","linkedin","website"].forEach(k=>document.querySelector('[data-ct="'+k+'"]').value=C.contact[k]||"");
$("pj").innerHTML=C.projects.map((p,i)=>`<div class="it"><label>Date<input data-k="projects.${i}.date" value="${esc(p.date)}"></label><label>Title<input data-k="projects.${i}.title" value="${esc(p.title)}"></label><label>Description<textarea data-k="projects.${i}.desc">${esc(p.desc)}</textarea></label><label>Tags (comma separated)<input data-k="projects.${i}.tags" value="${esc((p.tags||[]).join(", "))}"></label>${ctl("projects",i)}</div>`).join("");
$("bk").innerHTML=C.books.map((b,i)=>`<div class="it"><label>Type<select data-k="books.${i}.type">${[["nf","Non-fiction"],["sf","Semi-fiction"],["f","Fiction"]].map(([v,t])=>`<option value="${v}"${b.type===v?" selected":""}>${t}</option>`).join("")}</select></label><label>Title<input data-k="books.${i}.title" value="${esc(b.title)}"></label><label>Author<input data-k="books.${i}.author" value="${esc(b.author)}"></label><label>Your one-line takeaway<textarea data-k="books.${i}.line">${esc(b.line)}</textarea></label><div class="cv">${b.cover?`<img src="${esc(b.cover)}" alt="">`:""}<label>Cover image (jpg, png, webp, max 2 MB)<input type="file" accept="image/jpeg,image/png,image/webp" data-up="${i}"></label></div>${ctl("books",i)}</div>`).join("");drawMore()}
const ctl=(a,i)=>`<button class="g" data-mv="${a}.${i}.-1">↑</button> <button class="g" data-mv="${a}.${i}.1">↓</button> <button class="g" data-del="${a}.${i}">Delete</button>`;
const row=(a,x,i,l)=>`<div class="it"><label>Date<input data-k="${a}.${i}.date" value="${esc(x.date)}"></label><label>Title<input data-k="${a}.${i}.title" value="${esc(x.title)}"></label><label>${l}<input data-k="${a}.${i}.issuer" value="${esc(x.issuer)}"></label>${ctl(a,i)}</div>`;
function drawMore(){
$("ex").innerHTML=C.experience.map((x,i)=>`<div class="it"><label>Role<input data-k="experience.${i}.role" value="${esc(x.role)}"></label><label>Company<input data-k="experience.${i}.company" value="${esc(x.company)}"></label><label>Dates<input data-k="experience.${i}.dates" value="${esc(x.dates)}"></label><label>Bullets (one per line)<textarea style="min-height:130px" data-k="experience.${i}.bullets">${esc((x.bullets||[]).join("\n"))}</textarea></label>${ctl("experience",i)}</div>`).join("");
$("sk").innerHTML=C.skills.map((x,i)=>`<div class="it"><label>Category<input data-k="skills.${i}.category" value="${esc(x.category)}"></label><label>Skills (comma separated)<input data-k="skills.${i}.items" value="${esc((x.items||[]).join(", "))}"></label>${ctl("skills",i)}</div>`).join("");
$("ce").innerHTML=C.certs.map((x,i)=>row("certs",x,i,"Issuer")).join("");
$("st").innerHTML=C.stats.map((x,i)=>`<div class="it"><label>Value (e.g. 3+)<input data-k="stats.${i}.value" value="${esc(x.value)}"></label><label>Label<input data-k="stats.${i}.label" value="${esc(x.label)}"></label>${ctl("stats",i)}</div>`).join("");
$("ed").innerHTML=C.education.map((x,i)=>row("education",x,i,"School")).join("")}
const adds={addx:["experience",{role:"New role",company:"",dates:"",bullets:[]}],addsk:["skills",{category:"New category",items:[]}],addc:["certs",{date:"",title:"New certificate",issuer:""}],addst:["stats",{value:"",label:""}],adde:["education",{date:"",title:"New degree",issuer:""}]};
Object.keys(adds).forEach(k=>$(k).onclick=()=>{C[adds[k][0]].push({...adds[k][1]});draw()});
$("app").addEventListener("input",e=>{const k=e.target.dataset.k;if(k){const[a,i,f]=k.split(".");C[a][i][f]=(f==="tags"||f==="items")?e.target.value.split(",").map(x=>x.trim()).filter(Boolean):f==="bullets"?e.target.value.split("\n").map(x=>x.trim()).filter(Boolean):e.target.value}
if(e.target.id==="lead")C.settings.lead=e.target.value;if(e.target.id==="abt")C.settings.about=e.target.value;if(e.target.dataset.ct)C.contact[e.target.dataset.ct]=e.target.value;if(e.target.id==="otx")C.settings.openText=e.target.value;if(e.target.id==="otw")C.settings.openToWork=e.target.checked});
$("app").addEventListener("click",e=>{const m=e.target.dataset.mv;if(m){const[a,i,d]=m.split(".");const x=+i,y=x+ +d;if(y>=0&&y<C[a].length){[C[a][x],C[a][y]]=[C[a][y],C[a][x]];draw()}return}const d=e.target.dataset.del;if(d&&confirm("Delete this item?")){const[a,i]=d.split(".");C[a].splice(+i,1);draw()}});
$("app").addEventListener("change",async e=>{const i=e.target.dataset.up;if(i===undefined||!e.target.files[0])return;const f=e.target.files[0];
try{const r=await api("/api/upload",{method:"POST",headers:{"Content-Type":f.type},body:f});C.books[i].cover=r.url;draw();toast("Cover uploaded, remember to save")}catch(x){toast(x.message,1)}});
$("addp").onclick=()=>{C.projects.push({date:"",title:"New project",desc:"",tags:[]});draw()};
$("addb").onclick=()=>{C.books.push({type:"nf",title:"New book",author:"",line:"",cover:""});draw()};
$("save").onclick=async()=>{try{await api("/api/content",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(C)});toast("Saved. Reload the site to see it.")}catch(x){toast(x.message,1);if(x.message==="unauthorized")location.reload()}};
$("out").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()};
async function login(){try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})});await load()}catch(x){$("err").textContent=x.message}}
$("go").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};
api("/api/session").then(r=>r.auth&&load()).catch(()=>{});
</script></body></html>
